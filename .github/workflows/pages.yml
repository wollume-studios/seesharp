name: Pages

# The site at https://wollume-studios.github.io/seesharp/: the landing page from site/ plus updatePlugins.xml, the Rider
# plugin repository. Both name the latest release. Runs after every release (release.yml calls it) and when site/ changes
# on main; the github-pages environment only deploys from main and v* tags.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fill in the latest release and write updatePlugins.xml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          VERSION="${TAG#v}"
          ZIP="https://github.com/$REPO/releases/download/$TAG/SeeSharp-$VERSION.zip"
          mkdir out
          cp -r site/. out/
          sed -i "s/{{VERSION}}/$VERSION/g" out/index.html
          # since-build must match SinceBuild in ide/rider/gradle.properties.
          cat > out/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="dev.seesharp.rider" url="$ZIP" version="$VERSION">
              <idea-version since-build="262"/>
              <name>SeeSharp</name>
              <vendor>SeeSharp</vendor>
              <description>SeeSharp C# training: exercises, instructions and grading in Rider.</description>
            </plugin>
          </plugins>
          EOF
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
