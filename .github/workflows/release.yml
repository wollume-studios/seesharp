name: Release

# Publishes SeeSharp.Cli to nuget.org with trusted publishing (no stored API key); see docs/RELEASING.md.
# Actions are pinned to commit SHAs; only the small publish job can mint an OIDC token.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack src/SeeSharp.Cli -c Release -p:Version=${TAG#v} -o nupkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nupkg
          path: nupkg
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" nupkg/*.nupkg --clobber
          else
            gh release create "$TAG" nupkg/*.nupkg --title "$TAG" --generate-notes --verify-tag
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for NuGet/login
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # IDE plugins: built from the tagged commit with the tag's version. This job runs Gradle and npm
  # code, so it only gets a read-only token (not persisted); attaching happens in plugins-release.
  plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Version from tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Rider plugin
        working-directory: ide/rider
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin -PPluginVersion="$VERSION" --console=plain
      - name: VS Code extension
        working-directory: ide/vscode
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx --no-install vsce package -o "seesharp-$VERSION.vsix"   # vsce pinned in package-lock.json
      - name: Collect
        run: |
          mkdir dist
          cp "ide/rider/build/distributions/SeeSharp-$VERSION.zip" "ide/vscode/seesharp-$VERSION.vsix" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins
          path: dist/*

  # Attaches the plugin files to the release; runs no third-party code, so it may write.
  plugins-release:
    needs: [github-release, plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugins
          path: plugins
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" plugins/* --clobber

  # GitHub Pages: the landing page from site/ and the Rider plugin repository (updatePlugins.xml), both naming
  # this release. Deploys via OIDC, so this job alone gets pages + id-token.
  feed:
    needs: plugins-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
